name: turbine-neo4j-v2

services:
  neo4j:
    image: neo4j:5.26.29
    container_name: turbine-neo4j-v2
    restart: unless-stopped
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - ./docker-data/neo4j-data:/data
      - ./docker-data/neo4j-logs:/logs
    networks:
      - turbine-neo4j-v2

networks:
  turbine-neo4j-v2:
    name: turbine-neo4j-v2-network
