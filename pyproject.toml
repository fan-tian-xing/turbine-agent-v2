[project]
name = "turbine-kg"
version = "0.1.0"
description = "Evidence-grounded turbine installation and commissioning assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "neo4j>=6.2,<7",
    "numpy>=2.4,<3",
    "opencv-python>=4.13,<5",
    "pymupdf>=1.28,<2",
    "rapidocr-onnxruntime>=1.4,<2",
    "rdflib>=7,<8",
    "pyshacl>=0.30,<1",
    "jsonschema>=4.26,<5",
]

[project.scripts]
turbine-stage3 = "turbine_kg.stage3.cli:main"
turbine-trial = "turbine_kg.stage3.trial_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "scripts"]
filterwarnings = [
    "ignore:Dataset.default_context is deprecated, use Dataset.default_graph instead.:DeprecationWarning:rdflib.graph",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
